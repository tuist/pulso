name: pulso

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pulso-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Compile
            command: mix compile --warnings-as-errors
          - name: Test
            command: mix test
          - name: Quokka
            command: mix format --check-formatted
          - name: Credo
            command: mix credo
    steps:
      - uses: actions/checkout@v4

      # Versions here must stay in sync with mise.toml.
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1"
          elixir-version: "1.20.4-otp-29"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/pulso_object_store -> target
          key: ${{ matrix.check.name }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-deps-

      # NOTE: We deliberately do NOT cache _build. Rustler produces the NIF
      # shared object as a compile-time side effect via `use Rustler`, and
      # Mix's incremental compile does not track it. A restored _build makes
      # Mix think the modules are up to date and skip re-running Rustler,
      # even when the .so is absent. Rust compilation stays fast thanks to
      # Swatinem/rust-cache keeping native/pulso_object_store/target warm.

      - name: Install dependencies
        run: mix deps.get

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

  integration:
    name: Integration
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      PULSO_INTEGRATION: "1"
      PULSO_MINIO_ENDPOINT: "http://localhost:9000"
      PULSO_MINIO_BUCKET: "pulso"
      PULSO_MINIO_REGION: "us-east-1"
      PULSO_MINIO_ACCESS_KEY_ID: "minioadmin"
      PULSO_MINIO_SECRET_ACCESS_KEY: "minioadmin"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1"
          elixir-version: "1.20.4-otp-29"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/pulso_object_store -> target
          key: integration

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-deps-

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is up"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not start in time"
          docker logs minio
          exit 1

      - name: Create bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: aws --endpoint-url http://localhost:9000 s3 mb s3://pulso

      - name: Install dependencies
        run: mix deps.get

      - name: Run integration tests
        run: mix test --only integration
