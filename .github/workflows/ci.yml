name: pulso

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pulso-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      # Compile the NIF from source so we prove every branch keeps
      # building the Rust crate. Downstream consumers unset this and
      # download the precompiled artifact matching the mix version.
      PULSO_NIF_FORCE_BUILD: "1"
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Compile
            command: mix compile --warnings-as-errors
          - name: Test
            command: mix test
          - name: Quokka
            command: mix format --check-formatted
          - name: Credo
            command: mix credo
    steps:
      - uses: actions/checkout@v4

      # Versions here must stay in sync with mise.toml.
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1"
          elixir-version: "1.20.4-otp-29"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/pulso_object_store -> target
          key: ${{ matrix.check.name }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-deps-

      # NOTE: We deliberately do NOT cache _build. Rustler produces the NIF
      # shared object as a compile-time side effect via `use Rustler`, and
      # Mix's incremental compile does not track it. A restored _build makes
      # Mix think the modules are up to date and skip re-running Rustler,
      # even when the .so is absent. Rust compilation stays fast thanks to
      # Swatinem/rust-cache keeping native/pulso_object_store/target warm.

      - name: Install dependencies
        run: mix deps.get

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

  integration:
    name: Integration
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      PULSO_INTEGRATION: "1"
      PULSO_NIF_FORCE_BUILD: "1"
      # RustFS in docker-compose binds to these host ports by default (see
      # mise/utilities/dev_instance_env.sh for the local per-worktree scheme).
      PULSO_RUSTFS_API_PORT: "11100"
      PULSO_RUSTFS_CONSOLE_PORT: "12100"
      PULSO_S3_ENDPOINT: "http://localhost:11100"
      PULSO_S3_BUCKET: "pulso"
      PULSO_S3_REGION: "us-east-1"
      PULSO_S3_ACCESS_KEY_ID: "rustfsadmin"
      PULSO_S3_SECRET_ACCESS_KEY: "rustfsadmin"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1"
          elixir-version: "1.20.4-otp-29"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/pulso_object_store -> target
          key: integration

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-deps-

      - name: Start RustFS via docker compose
        run: |
          docker compose up -d rustfs
          for _ in $(seq 1 60); do
            if curl -sf "http://localhost:${PULSO_RUSTFS_API_PORT}/" > /dev/null 2>&1 \
              || curl -sf -o /dev/null -w '%{http_code}' "http://localhost:${PULSO_RUSTFS_API_PORT}/" | grep -qE '^(200|403|404)$'; then
              echo "RustFS is up"
              exit 0
            fi
            sleep 1
          done
          echo "RustFS did not start in time"
          docker compose logs rustfs
          exit 1

      - name: Create bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ env.PULSO_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.PULSO_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.PULSO_S3_REGION }}
        run: aws --endpoint-url "http://localhost:${PULSO_RUSTFS_API_PORT}" s3 mb "s3://${PULSO_S3_BUCKET}"

      - name: Install dependencies
        run: mix deps.get

      - name: Run integration tests
        run: mix test --only integration
