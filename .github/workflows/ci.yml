name: pulso

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pulso-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Compile
            command: mix compile --warnings-as-errors
          - name: Test
            command: mix test
          - name: Quokka
            command: mix format --check-formatted
          - name: Credo
            command: mix credo
    steps:
      - uses: actions/checkout@v4

      # Versions here must stay in sync with mise.toml.
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1"
          elixir-version: "1.20.4-otp-29"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-deps-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-mix-build-${{ hashFiles('mix.lock') }}-${{ matrix.check.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mix-build-${{ hashFiles('mix.lock') }}-${{ matrix.check.name }}-
            ${{ runner.os }}-mix-build-${{ hashFiles('mix.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}
