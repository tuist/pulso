[package]
name = "pulso_codec"
version = "0.1.0"
authors = []
edition = "2021"

[lib]
name = "pulso_codec"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
snap = "1.1"
simdutf8 = "0.1"
memchr = "2"
itoa = "1"
ryu = "1"
arrow = { version = "54", default-features = false }
parquet = { version = "54", default-features = false, features = ["arrow", "zstd"] }
bytes = "1"

[profile.release]
lto = true
codegen-units = 1
