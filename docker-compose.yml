# Local development stack for Pulso.
#
# `docker compose up -d` gives you MinIO on http://localhost:9000 with a
# preseeded bucket named `pulso`. The console is on http://localhost:9001
# (user/password: minioadmin/minioadmin).

services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/pulso;
        mc anonymous set none local/pulso;
        echo 'pulso bucket ready';
      "

volumes:
  minio-data:
