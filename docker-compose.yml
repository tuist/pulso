# Local development stack for Pulso.
#
# `docker compose up -d` gives you a RustFS (S3-compatible) server on
# http://localhost:9000 with a preseeded bucket named `pulso`. The console is
# on http://localhost:9001 (user/password: rustfsadmin/rustfsadmin).
#
# RustFS is used instead of MinIO because MinIO's community edition is no
# longer actively maintained. Pulso only talks to the S3 API, so any
# S3-compatible backend works; RustFS is a drop-in that stays maintained.

services:
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      # RUSTFS_VOLUMES is required — without it RustFS exits at startup.
      # The `{0..3}` template creates four storage volumes under /data.
      RUSTFS_VOLUMES: /data/rustfs{0..3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    # Bind to loopback only so the well-known dev credentials cannot be reached
    # from another host on the LAN.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data

  rustfs-init:
    image: amazon/aws-cli:2
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        for i in $$(seq 1 60); do
          if aws --endpoint-url http://rustfs:9000 s3 mb s3://pulso 2>/dev/null; then
            echo "pulso bucket created"
            exit 0
          fi
          if aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket pulso 2>/dev/null; then
            echo "pulso bucket already exists"
            exit 0
          fi
          echo "waiting for rustfs..."
          sleep 2
        done
        echo "gave up waiting for rustfs" >&2
        exit 1

volumes:
  rustfs-data:
